# 推送 v* 标签（如 v0.2.0）：测试、打签名包，发布到本仓库的 Releases。
# 代码与发布在同一个公开仓库；应用内"检查更新"读的就是这里的最新 Release（app-distribution 规格）。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（如 v0.2.0），需已存在"
        required: true

# 发布 Release、推送 dist 分支都用自带的 GITHUB_TOKEN，不需要额外令牌
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # v0.3.1 → versionName 0.3.1，versionCode 301（主 × 10000 + 次 × 100 + 修订）
      - name: 计算版本号
        run: |
          v="${TAG#v}"
          IFS=. read -r major minor patch <<< "${v%%-*}"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))" >> "$GITHUB_ENV"

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "缺少 KEYSTORE_BASE64，发布包必须签名"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 还没有公网可达的 OAuth 代理时（没配置 BAIDU_APP_KEY / OAUTH_PROXY_BASE），发演示版：
      # 用内置的假网盘体验完整流程，不连真实百度网盘。两个 Secret 配好后下一个标签自动变成正式版。
      - name: 测试并构建
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BAIDU_APP_KEY: ${{ secrets.BAIDU_APP_KEY }}
          OAUTH_PROXY_BASE: ${{ secrets.OAUTH_PROXY_BASE }}
        run: |
          if [ -n "$BAIDU_APP_KEY" ] && [ -n "$OAUTH_PROXY_BASE" ]; then
            defines="--dart-define=BAIDU_APP_KEY=$BAIDU_APP_KEY --dart-define=OAUTH_PROXY_BASE=$OAUTH_PROXY_BASE"
            echo "DEMO=false" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 BAIDU_APP_KEY / OAUTH_PROXY_BASE，本次发布演示版"
            defines="--dart-define=DEMO_MODE=true"
            echo "DEMO=true" >> "$GITHUB_ENV"
          fi
          flutter pub get
          flutter test
          # 只打 ARM：x86_64 只有模拟器用得到
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            --dart-define=RELEASE_REPO="$RELEASE_REPO" $defines

      - name: 整理安装包与更新说明
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/yunting-$TAG.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/yunting.apk
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          # 附注标签的正文（第一行之后）作为更新说明；没有时用两个标签之间的提交标题
          tag_body=$(git tag -l --format='%(contents:body)' "$TAG" | sed '/^-----BEGIN PGP/,$d')
          {
            echo "## 云听书 $VERSION_NAME"
            echo
            if [ "$DEMO" = true ]; then
              echo "这是演示版：内置一个假网盘，可以体验书架、播放、续播、倍速、睡眠定时等完整流程，但不连接真实的百度网盘。"
              echo
            fi
            if [ -n "$(echo "$tag_body" | tr -d '[:space:]')" ]; then echo "$tag_body"
            elif [ -n "$prev" ]; then git log --pretty='- %s' "$prev..$TAG" --no-merges
            else git log --pretty='- %s' -20 "$TAG" --no-merges; fi
            echo
            echo "下载 yunting.apk 安装；已安装的用户可在「我的 → 检查更新」直接更新。"
          } > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: yunting-${{ env.TAG }}
          path: dist/
          retention-days: 30

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 云听书 ${{ env.VERSION_NAME }}${{ env.DEMO == 'true' && '（演示版）' || '' }}
          body_path: dist/notes.md
          files: |
            dist/yunting.apk
            dist/yunting-${{ env.TAG }}.apk
          make_latest: true

      # 版本信息的备用线路：latest.json 放到本仓库的 dist 分支，经 jsDelivr 分发（每次覆盖，只保留最新一版）。
      # 国内 api.github.com 经常不通，但 jsDelivr 通常可达，应用检查更新时两边并查。
      # 安装包不放镜像：云听书 APK 约 35MB，超过 jsDelivr 单文件 20MB 上限，下载只走 GitHub Releases。
      - name: 同步版本信息（jsDelivr）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$RELEASE_REPO"
          mkdir mirror && cd mirror
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          jq -n --arg v "$VERSION_NAME" --rawfile n ../dist/notes.md --arg p "https://github.com/$repo/releases/tag/$TAG" \
            --arg a "https://github.com/$repo/releases/download/$TAG/yunting.apk" \
            '{version: $v, notes: $n, page: $p, apk: [$a]}' > latest.json
          git add latest.json && git commit -qm "云听书 $VERSION_NAME 版本信息"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$repo.git" dist
          curl -s -o /dev/null "https://purge.jsdelivr.net/gh/$repo@dist/latest.json" || true
