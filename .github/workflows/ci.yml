# 每次推送到 main 或提交 PR：静态检查、单元测试，并打一个 release 包（作为构件保存 14 天）
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # freezed / drift / riverpod / json 的生成代码不入库（refactor-app-foundation D1）
      - run: dart run build_runner build -d
      - run: flutter analyze
      - run: flutter test --coverage

      - name: 覆盖率摘要
        run: |
          total=$(grep -c '^DA:' coverage/lcov.info || true)
          hit=$(grep '^DA:' coverage/lcov.info | grep -vc ',0$' || true)
          echo "行覆盖率：$hit / $total" >> "$GITHUB_STEP_SUMMARY"

      # 签名密钥来自仓库 Secrets；没有配置时用 debug 签名
      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 构建
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BAIDU_APP_KEY: ${{ secrets.BAIDU_APP_KEY }}
          OAUTH_PROXY_BASE: ${{ secrets.OAUTH_PROXY_BASE }}
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-name="0.0.${{ github.run_number }}-ci" --build-number="${{ github.run_number }}" \
            --dart-define=BAIDU_APP_KEY="$BAIDU_APP_KEY" \
            --dart-define=OAUTH_PROXY_BASE="$OAUTH_PROXY_BASE"

      - uses: actions/upload-artifact@v4
        with:
          name: yunting-ci-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
