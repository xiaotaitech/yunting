name: yun_audiobook
description: 以百度网盘为数据源的听书 App
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  clock: ^1.1.3
  crypto: ^3.0.7
  drift: ^2.35.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^3.4.3
  # 令牌必须进平台安全存储，不得明文落盘（netdisk-auth 规格）
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  # 播放：just_audio 支持 userAgent 与自定义 header，且重定向后仍保留 UA，
  # 这是满足百度 dlink 强制 User-Agent: pan.baidu.com 的关键（design.md D1）。
  just_audio: ^0.10.6
  path: ^1.9.1
  # 本地持久化：SQLite 是书架与进度的权威来源（design.md D5）
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  sqlite3: ^3.7.0
  url_launcher: ^6.3.2


dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0


flutter:
  uses-material-design: true
  generate: true
  # 使用帮助（app-help 规格）
  assets:
    - assets/help.md
