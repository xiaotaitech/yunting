# 严格 lint（refactor-app-foundation D1）。例外只开两条：
#   - public_member_api_docs：这是 App 不是库，公开成员不需要逐个写 dartdoc
#   - lines_longer_than_80_chars：中文注释与文案按 80 列折行反而难读
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # tool/ 下是一次性诊断脚本，不是产品代码——它们就是要往控制台打东西
    - tool/**
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
