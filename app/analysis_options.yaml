# 严格 lint（refactor-app-foundation D1）。例外只开两条：
#   - public_member_api_docs：这是 App 不是库，公开成员不需要逐个写 dartdoc
#   - lines_longer_than_80_chars：中文注释与文案按 80 列折行反而难读
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # tool/ 下是一次性诊断脚本，不是产品代码——它们就是要往控制台打东西
    - tool/**
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # 下面四条是风格偏好，与本仓库既有写法冲突且不提高正确性：
    #   fromErrno / fromJson 这类静态工厂比命名构造函数更直白；
    #   测试里逐行 expect 比强行拼 cascade 好读；
    #   `return _withTokenRetry(...)` 包在 async 里是为了统一异常出口。
    prefer_constructors_over_static_methods: false
    cascade_invocations: false
    async_return_with_no_await: false
    prefer_foreach: false
    # 尾随逗号交给 dart format（Dart 3 的 tall 风格自己决定加不加），
    # 这条 lint 与格式化结果互相打架，格式化一遍就又冒出来。
    require_trailing_commas: false
